schema_version = 1
release = "0.1.0"

[[settings]]
key = "source.read_ahead_bytes"
type = "byte_size"
default = 2097152
range = { min = 65536, max = 67108864 }
unit = "bytes"
platforms = ["linux", "macos", "windows", "android", "google_tv", "ios", "ipados", "tvos", "web"]
audience = "integrator"
stability = "experimental"
apply = "next_load"
since = "0.1.0"
description = "Bytes the buffered reader keeps ahead of the last read position of a source. The default of 2 MiB follows #73. The reader asks the data source for more bytes only while fewer than this many are buffered ahead, so a progressive download pauses once the window is full."

[[settings]]
key = "source.type_hint"
type = "string"
default = ""
unit = ""
platforms = ["linux", "macos", "windows", "android", "google_tv", "ios", "ipados", "tvos", "web"]
audience = "integrator"
stability = "experimental"
apply = "next_load"
since = "0.1.0"
description = "Explicit media type of a source, set through the per-source overrides of ADR-0017. An explicit type is authoritative under ADR-0027: Umbra does not sniff, and the load fails if the bytes do not parse as that type. The empty default, or `auto`, detects the type from the first bytes of the response, with the extension and Content-Type only as tie-breakers. The accepted names are hls, dash, mp4, matroska, mpegts and flv."
