schema_version = 1
release = "0.1.0"

[[settings]]
key = "hls.keys.allow_insecure_key_uri"
type = "boolean"
default = false
unit = ""
platforms = ["linux", "macos", "windows", "android", "google_tv", "ios", "ipados", "tvos", "web"]
audience = "integrator"
stability = "experimental"
apply = "next_load"
since = "0.1.0"
description = "Allows an HTTPS HLS playlist to reference an HTTP key URI when enabled. The default is false."

[[settings]]
key = "hls.parser.strict"
type = "boolean"
default = false
unit = ""
platforms = ["linux", "macos", "windows", "android", "google_tv", "ios", "ipados", "tvos", "web"]
audience = "integrator"
stability = "experimental"
apply = "next_load"
since = "0.1.0"
description = "Rejects HLS playlists that violate a SHOULD-level rule when enabled. The default is false."

[[settings]]
key = "hls.live.start_offset_ms"
type = "integer"
default = -1
range = { min = -1, max = 3600000 }
unit = "ms"
platforms = ["linux", "macos", "windows", "android", "google_tv", "ios", "ipados", "tvos", "web"]
audience = "integrator"
stability = "experimental"
apply = "next_load"
since = "0.1.0"
description = "Distance in milliseconds from the live end when starting playback. The default -1 follows EXT-X-START, HOLD-BACK and three target durations, in that order."

[[settings]]
key = "hls.live.stale_playlist_failover"
type = "boolean"
default = true
unit = ""
platforms = ["linux", "macos", "windows", "android", "google_tv", "ios", "ipados", "tvos", "web"]
audience = "integrator"
stability = "experimental"
apply = "live"
since = "0.1.0"
description = "Allows failover when a live media playlist remains unchanged for at least 1.5 target durations. The default is true."
