schema_version = 1
release = "0.1.0"

[[settings]]
key = "audio.downmix.mode"
type = "enum"
default = "auto"
values = [
  { value = "auto", description = "Downmix to the output channel count when needed." },
  { value = "stereo", description = "Downmix to stereo." },
  { value = "none", description = "Preserve the input channel count." },
]
unit = ""
platforms = ["linux", "macos", "windows"]
audience = "end_user"
stability = "experimental"
apply = "next_load"
since = "0.1.0"
description = "Audio channel conversion policy. Automatic downmix uses ITU-R BS.775 coefficients; the default is auto."

[[settings]]
key = "audio.output.channels"
type = "integer"
default = 0
range = { min = 0, max = 8 }
unit = ""
platforms = ["linux", "macos", "windows"]
audience = "end_user"
stability = "experimental"
apply = "next_load"
since = "0.1.0"
description = "Requested audio output channel count. Zero selects the device default."

[[settings]]
key = "audio.output.device"
type = "string"
default = ""
unit = ""
platforms = ["linux", "macos"]
audience = "end_user"
stability = "experimental"
apply = "restart"
since = "0.1.0"
description = "Name of the audio output device that the desktop audio sink opens, as SDL reports it. The empty default opens the system default device, which SDL follows when the user changes it. A name that no device has makes the sink fail to start with a not-found error. The sink never falls back to the default device at start, only after a named device is removed during playback. `audio.output.buffer_frames` is not a key: the sink keeps SDL's device default until the sync measurements of #93 justify another value."

[[settings]]
key = "audio.resampler.quality"
type = "enum"
default = "high"
values = [
  { value = "low", description = "Use a short resampling filter for lower latency." },
  { value = "medium", description = "Balance resampling quality and latency." },
  { value = "high", description = "Use the highest quality resampling filter." },
]
unit = ""
platforms = ["linux", "macos", "windows"]
audience = "end_user"
stability = "experimental"
apply = "next_load"
since = "0.1.0"
description = "Quality preset used when converting audio sample rates. The default is high."
