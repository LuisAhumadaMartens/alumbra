    sha256: "efa9062d9cdb7a338e40ad530dfdf234806743f29ae6a1a136b97ece4e588e8f"
    size: 372178639
    file: tears_of_steel_720p.mov
    provenance: Blender Foundation Mango open movie (2012), the "HD rendered" 720p release listed at https://mango.blender.org/download/ and served by the Blender mirrors named there; the canonical copy is https://download.blender.org/demo/movies/ToS/tears_of_steel_720p.mov.
