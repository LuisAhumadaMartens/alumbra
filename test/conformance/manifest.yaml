    provenance: FFmpeg testsrc frame counter with a full-frame white flash on every 30th frame and a one-frame 1 kHz beep starting at the same instant, 10 s at 30 fps and 48 kHz, encoded with libx264 and the native FFmpeg AAC encoder by the committed generator.
    licence:
      spdx: Apache-2.0
