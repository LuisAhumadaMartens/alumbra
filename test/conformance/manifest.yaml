schema: 1
tags:
  aac: AAC audio.
  ac-3: Dolby Digital (AC-3) audio.
  audio-only: No video track.
  av-sync: Video flashes and audio beeps that mark the same instants for synchronisation measurement.
  byte-range: Media segments addressed by HTTP byte ranges.
  closed-captions: CEA-608 closed captions carried in the video.
  dash: MPEG-DASH.
  eac-3: Dolby Digital Plus (E-AC-3) audio.
  flac: FLAC audio.
  fmp4: Fragmented MP4 media segments.
  frame-numbered: Every video frame shows its frame index.
  generated: Generated locally by a committed FFmpeg script; never downloaded.
  h264: H.264 (AVC) video.
  hevc: H.265 (HEVC) video.
  hls: HTTP Live Streaming.
  live: Live presentation without a fixed duration.
  mov: QuickTime file format.
  mp3: MP3 audio.
  mp4: Unfragmented ISO base media file.
  multi-audio: More than one audio rendition.
  multi-period: DASH presentation with more than one period.
  multi-variant: Several video variants for adaptive bitrate selection.
  ogg: Ogg container.
  opus: Opus audio.
  progressive: A single file played without a streaming manifest.
  remote: Streamed from a public third-party server at test time; never cached or mirrored.
  srt: SubRip text subtitles.
  subtitles: Text subtitles.
  tone: Sine reference tones.
  trick-play: I-frame-only playlists for trick play.
entries:
