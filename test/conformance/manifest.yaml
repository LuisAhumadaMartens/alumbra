    sha256: "efa9062d9cdb7a338e40ad530dfdf234806743f29ae6a1a136b97ece4e588e8f"
    size: 372178639
    file: tears_of_steel_720p.mov
    provenance: Blender Foundation Mango open movie (2012), the "HD rendered" 720p release listed at https://mango.blender.org/download/ and served by the Blender mirrors named there; the canonical copy is https://download.blender.org/demo/movies/ToS/tears_of_steel_720p.mov.
    licence:
      spdx: CC-BY-3.0
      url: https://creativecommons.org/licenses/by/3.0/
      evidence: https://mango.blender.org/about/
      attribution: "(CC) Blender Foundation | mango.blender.org"
      notes: Logos and associated trademarks are excluded from the licence. Screenings and redistribution of the film must keep its credit scroll.
    redistributable: true
    protocol: progressive
    container: mov
    codecs: [avc1.4d401f, mp3]
    tags: [progressive, mov, h264, mp3]
    platforms: [linux, macos]
    expected:
      outcome: plays
      duration:
        value: 17620
        timescale: 24
      tracks:
        - type: video
          codec: avc1.4d401f
          width: 1280
          height: 534
          frame_rate: 24
          frames: 17620
        - type: audio
          codec: mp3
          sample_rate: 44100
          channels: 2
