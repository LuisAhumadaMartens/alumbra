[[row]]
name = "src"
kind = "attribute"
cpp = ["src", "set_src"]
status = "implemented"
since = "M1"
stability = "stable"
tests = [
  "PlayerTest.SettingSrcRunsTheLoadAlgorithm",
  "PlayerTest.AnEmptySrcFailsAsUnsupported",
  "WptResourceSelectionInvoke.SettingSrcInvokesTheLoadAlgorithm",
  "WptResourceSelectionInvoke.AnEmptySrcFiresLoadstartAndNeverLoads",
  "WptResourceSelectionInvoke.SettingSrcAfterPlayLeavesTheElementPaused",
  "WptResourceSelectionInvoke.SettingAnEmptySrcAfterPlayLeavesTheElementPaused",
  "WptPublicPlayer.AnEmptySrcFailsWithSrcNotSupported",
]
deviations = [
  "WptErrorSequence.DISABLED_EmptySrcQueuesVolumechangeBeforeLoadstart: loadstart is queued synchronously instead of at a stable state (#408)",
]

