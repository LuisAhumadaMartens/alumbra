[files]
extend-exclude = [
  "docs/reference/error-catalogue.md",
  "docs/adr/0*.md",
]

[default]
locale = "en-gb"
check-filename = false
check-file = false
extend-ignore-re = [
  "(?s)```.*?```",
  "``[^`]+``",
  "`[^`\\n]+`",
  "\\]\\([^)\\s]+\\)",
  "<https?://[^>\\s]+>",
  "https?://[^\\s)>\\]]+",
  "\\[Color\\]",
  "\\bColor (?:[Mm]odule|\\(colour)",
  "\\bdocumentation catalog\\b",
]

[default.extend-words]
Analyze = "Analyze"
dialog = "dialog"
dialogs = "dialogs"
sanitizer = "sanitizer"
sanitizers = "sanitizers"
seeked = "seeked"
tunneled = "tunneled"
tunneling = "tunneling"

[type.md]
check-file = true
