# Source of truth for repository labels. Synced by scripts/github/sync_repo_metadata.py.
# Taxonomy and meaning: docs/process.md#labels

- {name: "type:definition", color: "5319e7", description: "Open design question, debated and settled as an ADR"}
- {name: "type:epic", color: "3e4b9e", description: "Group of work items delivering a milestone outcome"}
- {name: "type:feature", color: "1d76db", description: "New user- or integrator-visible capability"}
- {name: "type:task", color: "0e8a16", description: "Engineering work without new user-visible behaviour"}
- {name: "type:bug", color: "d73a4a", description: "Something does not work as specified"}
- {name: "type:docs", color: "0075ca", description: "Documentation work"}
- {name: "type:research", color: "8a63d2", description: "Investigation or experiment that informs a decision"}
- {name: "type:chore", color: "cfd3d7", description: "Maintenance: tooling, dependencies, housekeeping"}

- {name: "layer:umbra", color: "1b1f24", description: "Umbra: portable C++ engine"}
