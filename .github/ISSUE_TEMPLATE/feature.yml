name: Feature / task
description: A unit of implementation work.
labels: ["type:feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What and why, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist of verifiable outcomes.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings introduced
      description: New settings keys with type, default and range. "None" if not applicable.
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Blocking definitions or issues.
  - type: textarea
    id: references
    attributes:
      label: References
