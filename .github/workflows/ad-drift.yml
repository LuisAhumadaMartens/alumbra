name: Ad response drift

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Compare live sample ad sources
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch and compare live sources
        run: python3 tools/conformance/ad_drift.py --output "$RUNNER_TEMP/ad-drift/report.json"
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ad-response-drift
          path: ${{ runner.temp }}/ad-drift/report.json
          if-no-files-found: warn
