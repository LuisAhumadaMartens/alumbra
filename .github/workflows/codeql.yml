name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      cxx: ${{ steps.classify.outputs.cxx }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: python3 tools/ci/classify_changes.py >> "$GITHUB_OUTPUT"

  workflows:
    name: Analyze workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: actions
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: /language:actions

  cxx:
    name: Analyze C++
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.cxx == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    env:
      CC: gcc-15
      CXX: g++-15
      ALUMBRA_CODEQL_BUILD_DIR: ${{ github.workspace }}/codeql-build
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
      VCPKG_DISABLE_METRICS: "1"
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out Alumbra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: src
          persist-credentials: false
      - name: Read the vcpkg baseline
        id: baseline
        run: echo "sha=$(jq -r '."builtin-baseline"' vcpkg.json)" >> "$GITHUB_OUTPUT"
      - name: Check out vcpkg at the baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.sha }}
          path: vcpkg
          persist-credentials: false
      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm
      - name: Identify the compiler
        id: toolchain
        run: |
          "$CXX" --version > "$RUNNER_TEMP/compiler.txt"
          cat "$RUNNER_TEMP/compiler.txt"
          echo "hash=$(shasum -a 256 "$RUNNER_TEMP/compiler.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Bootstrap vcpkg
        run: ../vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Restore the Linux GCC vcpkg binary cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-linux-gcc-x64-linux-${{ steps.toolchain.outputs.hash }}-${{ steps.baseline.outputs.sha }}-${{ hashFiles('src/vcpkg.json', 'src/cmake/triplets/**') }}
          restore-keys: |
            vcpkg-linux-gcc-x64-linux-${{ steps.toolchain.outputs.hash }}-${{ steps.baseline.outputs.sha }}-
            vcpkg-linux-gcc-x64-linux-${{ steps.toolchain.outputs.hash }}-
      - name: Configure debug and install dependencies before tracing
        run: cmake --preset debug -B "$ALUMBRA_CODEQL_BUILD_DIR" -DALUMBRA_BUILD_UI=ON -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
          source-root: src
      - name: Build debug under the CodeQL tracer
        run: cmake --build "$ALUMBRA_CODEQL_BUILD_DIR"
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: /language:c-cpp
          checkout_path: ${{ github.workspace }}/src
