name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      cxx: ${{ steps.classify.outputs.cxx }}
      site: ${{ steps.classify.outputs.site }}
      tokens: ${{ steps.classify.outputs.tokens }}
      cpp_reference: ${{ steps.classify.outputs.cpp_reference }}
      llvm_major: ${{ steps.llvm.outputs.major }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: python3 tools/ci/classify_changes.py >> "$GITHUB_OUTPUT"
      - name: Read LLVM major
        id: llvm
        run: echo "major=$(cat tools/ci/llvm-major)" >> "$GITHUB_OUTPUT"

      - name: Check error catalogue
        run: |
          python3 tools/errors/generate.py --check
          python3 tools/errors/generate_test.py

  format:
    name: Check C++ formatting
    needs: changes
    if: needs.changes.outputs.cxx == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned formatter
        env:
          LLVM_MAJOR: ${{ needs.changes.outputs.llvm_major }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "clang-format-$LLVM_MAJOR"
      - name: Check formatting and show diffs
        run: scripts/format --check

  tidy:
    name: Check C++ lint and feature policy
    needs: changes
    if: needs.changes.outputs.cxx == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      LLVM_MAJOR: ${{ needs.changes.outputs.llvm_major }}
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
      VCPKG_DISABLE_METRICS: "1"
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out Alumbra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: src
          persist-credentials: false
      - name: Read the vcpkg baseline
        id: baseline
        run: echo "sha=$(jq -r '."builtin-baseline"' vcpkg.json)" >> "$GITHUB_OUTPUT"
      - name: Check out vcpkg at the baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.sha }}
          path: vcpkg
          persist-credentials: false
      - name: Install pinned LLVM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm \
            "clang-$LLVM_MAJOR" "clang-tidy-$LLVM_MAJOR"
          echo "CC=clang-$LLVM_MAJOR" >> "$GITHUB_ENV"
          echo "CXX=clang++-$LLVM_MAJOR" >> "$GITHUB_ENV"
      - name: Bootstrap vcpkg
        run: ../vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Restore the Clang binary cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: tidy-${{ runner.os }}-${{ steps.baseline.outputs.sha }}-${{ hashFiles('src/vcpkg.json', 'src/cmake/triplets/**') }}
          restore-keys: |
            vcpkg-linux-clang-x64-linux-
      - name: Configure debug
        run: cmake --preset debug
      - name: Build debug prerequisites
        run: cmake --build --preset debug
      - name: Lint every Alumbra translation unit
        run: scripts/tidy -j 2

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      - name: Run actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'
      - name: Install CI Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/python" -m pip install -r tools/ci/requirements.txt
      - name: Test CI helpers
        run: '"$RUNNER_TEMP/ci-venv/bin/python" -m unittest discover -s tools/ci -p ''test_*.py'''
      - name: Require full-SHA action pins
        run: '"$RUNNER_TEMP/ci-venv/bin/python" tools/ci/check_action_pins.py .github/workflows'

  cpp-reference:
    name: Build the C++ API reference
    needs: changes
    if: needs.changes.outputs.cpp_reference == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Doxygen
        run: |
          doxygen="$(python3 tools/cpp-reference/doxygen.py --install-dir "$RUNNER_TEMP/doxygen")"
          echo "DOXYGEN=$doxygen" >> "$GITHUB_ENV"
      - name: Prove the coverage gate rejects undocumented and stale symbols
        run: python3 -m unittest discover -s tools/cpp-reference -p 'test_*.py'
      - name: Build the reference and enforce coverage
        run: python3 tools/cpp-reference/build_reference.py --output "$RUNNER_TEMP/api/cpp"
      - name: Upload the reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cpp-api-reference
          path: ${{ runner.temp }}/api/cpp
          if-no-files-found: error

  settings:
    name: Validate settings
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate schema and compatibility
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            python3 tools/settings/validate.py --previous-ref "$BASE"
          else
            python3 tools/settings/validate.py
          fi
      - name: Test settings validator
        run: python3 -m unittest discover -s tools/settings -p 'test_*.py'
      - name: Fuzz settings parser
        run: python3 tools/settings/fuzz_validate.py --smoke 2000

  conformance:
    name: Validate conformance manifest
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate the manifest and attribution page
        run: |
          python3 tools/conformance/assets.py validate
          python3 tools/conformance/assets.py attribution --check
      - name: Install CI Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/python" -m pip install -r tools/ci/requirements.txt
      - name: Test the manifest tools
        env:
          ALUMBRA_REQUIRE_PYYAML: "1"
        run: '"$RUNNER_TEMP/ci-venv/bin/python" -m unittest discover -s tools/conformance -p ''test_*.py'''
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Generate and verify synthetic clips offline
        env:
          ALUMBRA_ASSET_OFFLINE: "1"
        run: |
          ffmpeg -hide_banner -version | head -n 1
          python3 tools/conformance/assets.py --cache "$RUNNER_TEMP/assets" fetch --tags generated
          second="$(python3 tools/conformance/assets.py --cache "$RUNNER_TEMP/assets" fetch --tags generated)"
          echo "$second"
          if echo "$second" | grep -v ': cached '; then
            echo "The second run did not serve every clip from the cache." >&2
            exit 1
          fi

  conformance-remote:
    name: Probe remote conformance vectors
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Probe remote streams and download sources
        run: python3 tools/conformance/assets.py probe
      - name: Install FFmpeg
        if: success() || failure()
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Fetch and verify small downloads
        if: success() || failure()
        run: python3 tools/conformance/assets.py --cache "$RUNNER_TEMP/assets" fetch --kind download --max-size 16777216 --probe

  licence:
    name: Licence inventory (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            id: linux-gcc
            runner: ubuntu-26.04
            cc: gcc-15
            cxx: g++-15
            triplet: x64-linux
            developer_dir: ""
          - name: macOS arm64
            id: macos-xcode
            runner: macos-26
            cc: clang
            cxx: clang++
            triplet: arm64-osx
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      TRIPLET: ${{ matrix.triplet }}
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
      VCPKG_DISABLE_METRICS: "1"
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out Alumbra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: src
          persist-credentials: false
      - name: Read the vcpkg baseline
        id: baseline
        run: echo "sha=$(jq -r '."builtin-baseline"' vcpkg.json)" >> "$GITHUB_OUTPUT"
      - name: Check out vcpkg at the baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.sha }}
          path: vcpkg
          persist-credentials: false
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm
      - name: Hash the compiler and SDK
        id: toolchain
        run: |
          {
            "$CXX" --version
            if [ "$RUNNER_OS" = "macOS" ]; then xcodebuild -version; fi
          } > "$RUNNER_TEMP/compiler.txt"
          echo "hash=$(shasum -a 256 "$RUNNER_TEMP/compiler.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Bootstrap vcpkg
        run: ../vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Restore the vcpkg binary cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ matrix.id }}-${{ matrix.triplet }}-${{ steps.toolchain.outputs.hash }}-${{ steps.baseline.outputs.sha }}-${{ hashFiles('src/vcpkg.json', 'src/cmake/triplets/**') }}
          restore-keys: |
            vcpkg-${{ matrix.id }}-${{ matrix.triplet }}-${{ steps.toolchain.outputs.hash }}-${{ steps.baseline.outputs.sha }}-
            vcpkg-${{ matrix.id }}-${{ matrix.triplet }}-${{ steps.toolchain.outputs.hash }}-
      - name: Install desktop and test dependency closure
        id: inventory
        run: |
          ../vcpkg/vcpkg install --triplet="$TRIPLET" \
            --overlay-triplets=cmake/triplets \
            --x-feature=desktop --x-feature=tests --x-no-default-features \
            --x-install-root=build/licence --no-print-usage
      - name: Save the vcpkg binary cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Check generated inventory
        run: |
          python3 tools/ci/third_party.py check --triplet "$TRIPLET" \
            --installed-root build/licence --vcpkg-root ../vcpkg \
            --manifest vcpkg.json --policy tools/ci/licence_policy.json \
            --output THIRD_PARTY.md --feature desktop --feature tests
      - name: Enforce licence policy
        if: ${{ always() && steps.inventory.outcome == 'success' }}
        run: |
          python3 tools/ci/third_party.py policy --triplet "$TRIPLET" \
            --installed-root build/licence --vcpkg-root ../vcpkg \
            --manifest vcpkg.json --policy tools/ci/licence_policy.json \
            --output THIRD_PARTY.md --feature desktop --feature tests
      - name: Prepare regenerated inventory artifact
        if: ${{ always() && steps.inventory.outcome == 'success' }}
        run: |
          cp THIRD_PARTY.md "$RUNNER_TEMP/THIRD_PARTY.md"
          python3 tools/ci/third_party.py generate --triplet "$TRIPLET" \
            --installed-root build/licence --vcpkg-root ../vcpkg \
            --manifest vcpkg.json --policy tools/ci/licence_policy.json \
            --output "$RUNNER_TEMP/THIRD_PARTY.md" --feature desktop --feature tests
      - name: Upload regenerated inventory
        if: ${{ always() && steps.inventory.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: licence-inventory-${{ matrix.triplet }}
          path: ${{ runner.temp }}/THIRD_PARTY.md
          if-no-files-found: warn

  tokens:
    name: Check design-token outputs
    needs: changes
    if: needs.changes.outputs.tokens == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up the pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - name: Set up the pinned JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 21.0.13+9
      - name: Install the pinned Kotlin compiler
        env:
          KOTLIN_VERSION: 2.4.21
          KOTLIN_SHA256: 7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd
        run: |
          archive="$RUNNER_TEMP/kotlin-compiler.zip"
          curl -sSfL -o "$archive" \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          echo "${KOTLIN_SHA256}  ${archive}" | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Install the locked token tooling
        working-directory: tools/design
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test the token generator and golden comparison
        run: python3 -m unittest discover -s tools/design -p 'test_*.py'
      - name: Generate all five output families
        run: python3 tools/design/generate_tokens.py --check
      - name: Type-check TypeScript
        working-directory: tools/design
        run: npm run typecheck
      - name: Lint CSS
        working-directory: tools/design
        run: npm run lint:css
      - name: Compile Kotlin
        run: |
          kotlinc -version
          kotlinc -Werror antumbra/generated/DesignTokens.kt tools/design/golden/Dump.kt \
            -include-runtime -d "$RUNNER_TEMP/design-tokens.jar"
      - name: Compare CSS, TypeScript and Kotlin values with the Resolver
        run: |
          python3 tools/design/golden_tokens.py --css
          python3 tools/design/golden_tokens.py --run \
            node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON tools/design/golden/dump.ts
          python3 tools/design/golden_tokens.py --run java -jar "$RUNNER_TEMP/design-tokens.jar"

  tokens_swift:
    name: Check Swift design-token output
    needs: changes
    if: needs.changes.outputs.tokens == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Type-check Swift
        run: |
          swiftc --version
          swiftc -typecheck -warnings-as-errors antumbra/generated/DesignTokens.swift
      - name: Compare Swift values with the Resolver
        run: |
          swiftc -warnings-as-errors antumbra/generated/DesignTokens.swift \
            tools/design/golden/main.swift -o "$RUNNER_TEMP/design-tokens"
          python3 tools/design/golden_tokens.py --run "$RUNNER_TEMP/design-tokens"

  prose:
    name: Check documentation prose
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install typos, Vale and the Google style
        env:
          TYPOS_VERSION: 1.51.1
          TYPOS_SHA256: 93c301fd4120ff076e2cc2a6d6a61cab4a4bdb81899287c0938b452e56d1f454
          VALE_VERSION: 3.25.1
          VALE_SHA256: 4bf5c5176b682b1da0830f471584d3494f1c2e27ee3029e1ad6f6661d4962182
          GOOGLE_STYLE_VERSION: 0.7.1
          GOOGLE_STYLE_SHA256: 4b67fca1f2a88595b2a578ab98bbf3017a23af677b04f93e862843f3ea1a9a0b
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/typos.tar.gz" \
            "https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${TYPOS_SHA256}  $RUNNER_TEMP/typos.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/typos.tar.gz" -C "$RUNNER_TEMP/bin" ./typos
          curl -sSfL -o "$RUNNER_TEMP/vale.tar.gz" \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  $RUNNER_TEMP/vale.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP/bin" vale
          curl -sSfL -o "$RUNNER_TEMP/google.zip" \
            "https://github.com/errata-ai/Google/releases/download/v${GOOGLE_STYLE_VERSION}/Google.zip"
          echo "${GOOGLE_STYLE_SHA256}  $RUNNER_TEMP/google.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/google.zip" -d tools/vale/styles
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check spelling and British English with typos
        run: typos --format brief
      - name: Check accepted ADRs for plain misspellings with typos
        run: typos --config .typos-adr.toml --format brief docs/adr
      - name: Check changed Markdown with Vale
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          python3 tools/ci/classify_changes.py --changed-markdown > "$RUNNER_TEMP/markdown.lst"
          if [ -s "$RUNNER_TEMP/markdown.lst" ]; then
            xargs -0 vale < "$RUNNER_TEMP/markdown.lst"
          else
            echo "No changed Markdown to check."
          fi

  site:
    name: Documentation site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  build:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.cxx == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 GCC 15
            id: linux-gcc
            runner: ubuntu-26.04
            cc: gcc-15
            cxx: g++-15
            triplet: x64-linux
            developer_dir: ""
          - name: Linux x64 Clang ${{ needs.changes.outputs.llvm_major }}
            id: linux-clang
            runner: ubuntu-26.04
            cc: clang
            cxx: clang++
            triplet: x64-linux
            developer_dir: ""
          - name: macOS arm64 Xcode 26.6
            id: macos-xcode
            runner: macos-26
            cc: clang
            cxx: clang++
            triplet: arm64-osx
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
      VCPKG_DISABLE_METRICS: "1"
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out Alumbra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: src
          persist-credentials: false
      - name: Select pinned Linux Clang
        if: matrix.id == 'linux-clang'
        env:
          LLVM_MAJOR: ${{ needs.changes.outputs.llvm_major }}
        run: |
          echo "CC=clang-$LLVM_MAJOR" >> "$GITHUB_ENV"
          echo "CXX=clang++-$LLVM_MAJOR" >> "$GITHUB_ENV"
      - name: Read the vcpkg baseline
        id: baseline
        run: echo "sha=$(jq -r '."builtin-baseline"' vcpkg.json)" >> "$GITHUB_OUTPUT"
      - name: Check out vcpkg at the baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.sha }}
          path: vcpkg
          persist-credentials: false
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm
      - name: Record the toolchain
        id: toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/reports/junit"
          {
            "$CXX" --version
            if [ "$RUNNER_OS" = "macOS" ]; then xcodebuild -version; fi
          } > "$RUNNER_TEMP/reports/compiler.txt"
          {
            cat "$RUNNER_TEMP/reports/compiler.txt"
            cmake --version | head -n 1
            echo "ninja $(ninja --version)"
            if [ "$RUNNER_OS" = "Linux" ]; then nasm --version; fi
            echo "runner image ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          } | tee "$RUNNER_TEMP/reports/toolchain.txt"
          echo "hash=$(shasum -a 256 "$RUNNER_TEMP/reports/compiler.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Bootstrap vcpkg
        run: ../vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Restore the vcpkg binary cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ matrix.id }}-${{ matrix.triplet }}-${{ steps.toolchain.outputs.hash }}-${{ steps.baseline.outputs.sha }}-${{ hashFiles('src/vcpkg.json', 'src/cmake/triplets/**') }}
          restore-keys: |
            vcpkg-${{ matrix.id }}-${{ matrix.triplet }}-${{ steps.toolchain.outputs.hash }}-${{ steps.baseline.outputs.sha }}-
            vcpkg-${{ matrix.id }}-${{ matrix.triplet }}-${{ steps.toolchain.outputs.hash }}-
      - name: Configure debug
        run: cmake --preset debug
      - name: Save the vcpkg binary cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Build debug
        run: cmake --build --preset debug
      - name: Test debug
        run: ctest --preset debug --output-junit "$RUNNER_TEMP/reports/junit/debug.xml"
      - name: Configure release
        run: cmake --preset release
      - name: Build release
        run: cmake --build --preset release
      - name: Test release
        run: ctest --preset release --output-junit "$RUNNER_TEMP/reports/junit/release.xml"
      - name: Summarize
        if: always()
        env:
          TITLE: ${{ matrix.name }}
        run: |
          for preset in debug release; do
            result="build/$preset/test/cxx-probe/cxx-probe-results.json"
            if [ -f "$result" ]; then cp "$result" "$RUNNER_TEMP/reports/cxx-probe-$preset.json"; fi
          done
          python3 tools/ci/summarize.py --title "$TITLE" \
            --probe "$RUNNER_TEMP/reports/cxx-probe-debug.json" \
            --junit "debug=$RUNNER_TEMP/reports/junit/debug.xml" \
            --junit "release=$RUNNER_TEMP/reports/junit/release.xml" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reports-${{ matrix.id }}
          path: ${{ runner.temp }}/reports
          if-no-files-found: warn

  sanitizers:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.cxx == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 Clang ${{ needs.changes.outputs.llvm_major }} ASan and UBSan
            id: linux-asan
            runner: ubuntu-26.04
            cc: clang
            cxx: clang++
            developer_dir: ""
            preset: asan
            sanitizer: address
            triplet: x64-linux-asan
            asan_options: detect_stack_use_after_return=1:strict_string_checks=1:detect_leaks=1
            ubsan_options: print_stacktrace=1:halt_on_error=1
            tsan_options: ""
          - name: Linux x64 Clang ${{ needs.changes.outputs.llvm_major }} TSan
            id: linux-tsan
            runner: ubuntu-26.04
            cc: clang
            cxx: clang++
            developer_dir: ""
            preset: tsan
            sanitizer: thread
            triplet: x64-linux-tsan
            asan_options: ""
            ubsan_options: ""
            tsan_options: halt_on_error=1:second_deadlock_stack=1
          - name: macOS arm64 Xcode 26.6 ASan and UBSan
            id: macos-asan
            runner: macos-26
            cc: clang
            cxx: clang++
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
            preset: asan
            sanitizer: address
            triplet: arm64-osx-asan
            asan_options: detect_stack_use_after_return=1:strict_string_checks=1
            ubsan_options: print_stacktrace=1:halt_on_error=1
            tsan_options: ""
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
      VCPKG_DISABLE_METRICS: "1"
      ASAN_OPTIONS: ${{ matrix.asan_options }}
      UBSAN_OPTIONS: ${{ matrix.ubsan_options }}
      TSAN_OPTIONS: ${{ matrix.tsan_options }}
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out Alumbra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: src
          persist-credentials: false
      - name: Select pinned Linux Clang
        if: runner.os == 'Linux'
        env:
          LLVM_MAJOR: ${{ needs.changes.outputs.llvm_major }}
        run: |
          echo "CC=clang-$LLVM_MAJOR" >> "$GITHUB_ENV"
          echo "CXX=clang++-$LLVM_MAJOR" >> "$GITHUB_ENV"
      - name: Read the vcpkg baseline
        id: baseline
        run: echo "sha=$(jq -r '."builtin-baseline"' vcpkg.json)" >> "$GITHUB_OUTPUT"
      - name: Check out vcpkg at the baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.sha }}
          path: vcpkg
          persist-credentials: false
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm
      - name: Record the toolchain
        id: toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/reports/junit"
          {
            "$CXX" --version
            if [ "$RUNNER_OS" = "macOS" ]; then xcodebuild -version; fi
          } > "$RUNNER_TEMP/reports/compiler.txt"
          {
            cat "$RUNNER_TEMP/reports/compiler.txt"
            cmake --version | head -n 1
            echo "ninja $(ninja --version)"
            if [ "$RUNNER_OS" = "Linux" ]; then nasm --version; fi
            echo "runner image ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          } | tee "$RUNNER_TEMP/reports/toolchain.txt"
          echo "hash=$(shasum -a 256 "$RUNNER_TEMP/reports/compiler.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Bootstrap vcpkg
        run: ../vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Restore the sanitizer vcpkg binary cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-sanitizer-${{ matrix.id }}-${{ matrix.triplet }}-${{ steps.toolchain.outputs.hash }}-${{ steps.baseline.outputs.sha }}-${{ hashFiles('src/vcpkg.json', 'src/cmake/triplets/**') }}
          restore-keys: |
            vcpkg-sanitizer-${{ matrix.id }}-${{ matrix.triplet }}-${{ steps.toolchain.outputs.hash }}-${{ steps.baseline.outputs.sha }}-
            vcpkg-sanitizer-${{ matrix.id }}-${{ matrix.triplet }}-${{ steps.toolchain.outputs.hash }}-
      - name: Configure sanitizer build
        run: cmake --preset "${{ matrix.preset }}" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
      - name: Save the sanitizer vcpkg binary cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Build sanitizer suite
        run: cmake --build --preset "${{ matrix.preset }}"
      - name: Verify executable and dependency instrumentation
        env:
          TRIPLET: ${{ matrix.triplet }}
          SANITIZER: ${{ matrix.sanitizer }}
        run: python3 tools/ci/verify_sanitizer_instrumentation.py --build-dir "build/${{ matrix.preset }}" --triplet "$TRIPLET" --sanitizer "$SANITIZER"
      - name: Test full sanitizer suite
        run: ctest --preset "${{ matrix.preset }}" --output-junit "$RUNNER_TEMP/reports/junit/sanitizer.xml"
      - name: Configure sanitizer canaries
        run: cmake --preset "${{ matrix.preset }}" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DALUMBRA_SANITIZER_CANARIES=ON
      - name: Build sanitizer canaries
        run: cmake --build --preset "${{ matrix.preset }}" --target alumbra_sanitizer_canaries
      - name: Prove the sanitizer canaries fail with the expected diagnostics
        env:
          ALUMBRA_CANARY_REPORT_DIR: ${{ runner.temp }}/reports/canaries
        run: ctest --preset "${{ matrix.preset }}" -L sanitizer_canary --output-junit "$RUNNER_TEMP/reports/junit/canaries.xml"
      - name: Upload sanitizer reports and canary evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sanitizer-reports-${{ matrix.id }}
          path: ${{ runner.temp }}/reports
          if-no-files-found: warn

  fuzz:
    name: Linux x64 Clang ${{ needs.changes.outputs.llvm_major }} libFuzzer smoke
    needs: changes
    if: needs.changes.outputs.cxx == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      LLVM_MAJOR: ${{ needs.changes.outputs.llvm_major }}
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
      VCPKG_DISABLE_METRICS: "1"
      ASAN_OPTIONS: detect_stack_use_after_return=1:strict_string_checks=1:detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out Alumbra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: src
          persist-credentials: false
      - name: Install pinned Linux Clang and libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-$LLVM_MAJOR" "libclang-rt-$LLVM_MAJOR-dev"
          echo "CC=clang-$LLVM_MAJOR" >> "$GITHUB_ENV"
          echo "CXX=clang++-$LLVM_MAJOR" >> "$GITHUB_ENV"
      - name: Read the vcpkg baseline
        id: baseline
        run: echo "sha=$(jq -r '."builtin-baseline"' vcpkg.json)" >> "$GITHUB_OUTPUT"
      - name: Check out vcpkg at the baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.sha }}
          path: vcpkg
          persist-credentials: false
      - name: Record the toolchain
        id: toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/reports/junit"
          "$CXX" --version > "$RUNNER_TEMP/reports/compiler.txt"
          {
            cat "$RUNNER_TEMP/reports/compiler.txt"
            cmake --version | head -n 1
            echo "ninja $(ninja --version)"
            echo "runner image ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "cpus $(nproc), memory $(free -m | awk '/^Mem:/ {print $2}') MB"
          } | tee "$RUNNER_TEMP/reports/toolchain.txt"
          echo "hash=$(shasum -a 256 "$RUNNER_TEMP/reports/compiler.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Bootstrap vcpkg
        run: ../vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Restore the fuzzing vcpkg binary cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-fuzz-x64-linux-asan-${{ steps.toolchain.outputs.hash }}-${{ steps.baseline.outputs.sha }}-${{ hashFiles('src/vcpkg.json', 'src/cmake/triplets/**') }}
          restore-keys: |
            vcpkg-fuzz-x64-linux-asan-${{ steps.toolchain.outputs.hash }}-${{ steps.baseline.outputs.sha }}-
            vcpkg-fuzz-x64-linux-asan-${{ steps.toolchain.outputs.hash }}-
      - name: Configure fuzz build
        run: cmake --preset fuzz -DVCPKG_TARGET_TRIPLET=x64-linux-asan
      - name: Save the fuzzing vcpkg binary cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Build fuzz targets and corpus replays
        run: cmake --build --preset fuzz
      - name: Replay corpora and run every registered target with the fixed budget
        env:
          ALUMBRA_FUZZ_REPORT_DIR: ${{ runner.temp }}/reports/fuzz
        run: ctest --preset fuzz --output-junit "$RUNNER_TEMP/reports/junit/fuzz.xml"
      - name: Configure fuzz canaries
        run: cmake --preset fuzz -DVCPKG_TARGET_TRIPLET=x64-linux-asan -DALUMBRA_FUZZ_CANARIES=ON
      - name: Build fuzz canaries
        run: cmake --build --preset fuzz --target alumbra_fuzz_canaries
      - name: Prove seeded bugs fail the smoke run and keep their reproducers
        env:
          ALUMBRA_FUZZ_REPORT_DIR: ${{ runner.temp }}/reports/fuzz
        run: ctest --preset fuzz -L fuzz_canary --output-junit "$RUNNER_TEMP/reports/junit/fuzz-canaries.xml"
      - name: Summarize
        if: always()
        run: |
          python3 tools/ci/summarize_fuzz.py --title "libFuzzer smoke" \
            --report-dir "$RUNNER_TEMP/reports/fuzz" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload fuzz reports and reproducers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fuzz-reports
          path: ${{ runner.temp }}/reports
          if-no-files-found: warn

  windows:
    name: Windows x64 clang-cl ${{ needs.changes.outputs.llvm_major }} MSVC STL
    needs: changes
    if: needs.changes.outputs.cxx == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 180
    env:
      LLVM_VERSION: 21.1.8
      LLVM_SHA256: 7a5386c26497db1691f320121e5b113364dd0274b98e55f15f4dbc00c0450113
      TRIPLET: x64-windows
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
      VCPKG_DISABLE_METRICS: "1"
    defaults:
      run:
        shell: bash
        working-directory: src
    steps:
      - name: Check out Alumbra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: src
          persist-credentials: false
      - name: Read the vcpkg baseline
        id: baseline
        run: echo "sha=$(jq -r '."builtin-baseline"' vcpkg.json)" >> "$GITHUB_OUTPUT"
      - name: Check out vcpkg at the baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.sha }}
          path: vcpkg
          persist-credentials: false
      - name: Install the pinned LLVM release
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o llvm.exe \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-win64.exe"
          echo "${LLVM_SHA256}  llvm.exe" | sha256sum --check --strict
          7z x -y -ollvm llvm.exe > /dev/null
          cygpath -w "$RUNNER_TEMP/llvm/bin" >> "$GITHUB_PATH"
          echo "CC=$(cygpath -m "$RUNNER_TEMP/llvm/bin/clang-cl.exe")" >> "$GITHUB_ENV"
          echo "CXX=$(cygpath -m "$RUNNER_TEMP/llvm/bin/clang-cl.exe")" >> "$GITHUB_ENV"
      - name: Set up the MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Record the toolchain
        id: toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/reports/junit"
          {
            "$CXX" --version
            echo "MSVC toolset ${VCToolsVersion:-unknown}"
            echo "Windows SDK ${WindowsSDKVersion:-unknown}"
          } > "$RUNNER_TEMP/reports/compiler.txt"
          {
            cat "$RUNNER_TEMP/reports/compiler.txt"
            cmake --version | head -n 1
            echo "ninja $(ninja --version)"
            echo "runner image ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          } | tee "$RUNNER_TEMP/reports/toolchain.txt"
          echo "hash=$(sha256sum "$RUNNER_TEMP/reports/compiler.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Bootstrap vcpkg
        run: ../vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: Restore the vcpkg binary cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-windows-clang-cl-${{ env.TRIPLET }}-${{ steps.toolchain.outputs.hash }}-${{ steps.baseline.outputs.sha }}-${{ hashFiles('src/vcpkg.json', 'src/cmake/triplets/**') }}
          restore-keys: |
            vcpkg-windows-clang-cl-${{ env.TRIPLET }}-${{ steps.toolchain.outputs.hash }}-${{ steps.baseline.outputs.sha }}-
            vcpkg-windows-clang-cl-${{ env.TRIPLET }}-${{ steps.toolchain.outputs.hash }}-
      - name: Install every manifest feature for the Windows triplet
        run: |
          ../vcpkg/vcpkg install --triplet="$TRIPLET" \
            --overlay-triplets=cmake/triplets \
            --x-feature=desktop --x-feature=tests --x-no-default-features \
            --x-install-root=build/vcpkg-all --no-print-usage
      - name: Save the vcpkg binary cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Configure debug
        run: cmake --preset windows-debug
      - name: Build debug
        run: cmake --build --preset windows-debug -- -k 0
      - name: Test debug
        run: ctest --preset windows-debug --output-junit "$RUNNER_TEMP/reports/junit/debug.xml"
      - name: Configure release
        run: cmake --preset windows-release
      - name: Build release
        run: cmake --build --preset windows-release
      - name: Test release
        run: ctest --preset windows-release --output-junit "$RUNNER_TEMP/reports/junit/release.xml"
      - name: Summarize
        if: always()
        env:
          TITLE: Windows x64 clang-cl MSVC STL
        run: |
          for preset in debug release; do
            result="build/windows-$preset/test/cxx-probe/cxx-probe-results.json"
            if [ -f "$result" ]; then cp "$result" "$RUNNER_TEMP/reports/cxx-probe-$preset.json"; fi
          done
          python tools/ci/summarize.py --title "$TITLE" \
            --probe "$RUNNER_TEMP/reports/cxx-probe-debug.json" \
            --junit "debug=$RUNNER_TEMP/reports/junit/debug.xml" \
            --junit "release=$RUNNER_TEMP/reports/junit/release.xml" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reports-windows-clang-cl
          path: ${{ runner.temp }}/reports
          if-no-files-found: warn

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - actionlint
      - settings
      - licence
      - conformance
      - build
      - format
      - tidy
      - sanitizers
      - fuzz
      - windows
      - tokens
      - tokens_swift
      - cpp-reference
      - prose
      - site
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require every job to succeed or be skipped by the path filter
        env:
          FOUNDATION_RESULTS: ${{ needs.changes.result }} ${{ needs.actionlint.result }} ${{ needs.settings.result }} ${{ needs.licence.result }} ${{ needs.conformance.result }}
          CXX_NEEDED: ${{ needs.changes.outputs.cxx }}
          BUILD_RESULT: ${{ needs.build.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          TIDY_RESULT: ${{ needs.tidy.result }}
          SANITIZERS_RESULT: ${{ needs.sanitizers.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          TOKENS_NEEDED: ${{ needs.changes.outputs.tokens }}
          TOKENS_RESULT: ${{ needs.tokens.result }}
          TOKENS_SWIFT_RESULT: ${{ needs.tokens_swift.result }}
          CPP_REFERENCE_NEEDED: ${{ needs.changes.outputs.cpp_reference }}
          CPP_REFERENCE_RESULT: ${{ needs.cpp-reference.result }}
          SITE_NEEDED: ${{ needs.changes.outputs.site }}
          PROSE_RESULT: ${{ needs.prose.result }}
          SITE_RESULT: ${{ needs.site.result }}
        run: python3 tools/ci/require_ci_jobs.py
