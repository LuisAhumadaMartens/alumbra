name: Pages

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      external-links:
        description: Also check external links
        type: boolean
        default: true
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  site:
    name: Build and check the site
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      url: ${{ steps.assemble.outputs.url }}
      base: ${{ steps.assemble.outputs.base }}
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: tools/site
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pnpm
        env:
          PNPM_VERSION: 12.16.1
          PNPM_SHA256: 565ff81174a14f6f7bd5d84c1b17e51031a80230d370a1fe24be5d16bd02a825
        run: |
          archive="$RUNNER_TEMP/pnpm.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/pnpm/pnpm/releases/download/v${PNPM_VERSION}/pnpm-linux-x64.tar.gz"
          echo "${PNPM_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/pnpm"
          tar -xzf "$archive" -C "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: tools/site/.nvmrc
      - name: Install site dependencies from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Install the browser that renders Mermaid diagrams
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Test the artefact assembly
        run: pnpm test
      - name: Build the site and fail on warnings
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee "$RUNNER_TEMP/site-build.log"
          if grep -n -E '\[(WARN|ERROR)\]|^\(!\) |^\[astro\] ' "$RUNNER_TEMP/site-build.log"; then
            echo "::error::The site build reported warnings."
            exit 1
          fi
      - name: Install pinned Doxygen
        working-directory: .
        run: |
          doxygen="$(python3 tools/cpp-reference/doxygen.py --install-dir "$RUNNER_TEMP/doxygen")"
          echo "DOXYGEN=$doxygen" >> "$GITHUB_ENV"
      - name: Build the C++ API reference
        working-directory: .
        run: python3 tools/cpp-reference/build_reference.py --output "$RUNNER_TEMP/api/cpp"
      - name: Assemble the Pages artefact
        id: assemble
        run: node scripts/assemble.mjs --output "$RUNNER_TEMP/pages" --subtree "api/cpp=$RUNNER_TEMP/api/cpp" >> "$GITHUB_OUTPUT"
      - name: Install lychee
        env:
          LYCHEE_VERSION: 0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          archive="$RUNNER_TEMP/lychee.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
      - name: Check internal links and anchors
        env:
          ROOT: ${{ steps.assemble.outputs.root }}
          ARTEFACT: ${{ steps.assemble.outputs.artefact }}
        run: '"$RUNNER_TEMP/lychee" --config lychee.toml --offline --root-dir "$ROOT" "$ARTEFACT"'
      - name: Upload the Pages artefact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ steps.assemble.outputs.artefact }}

  external-links:
    name: Check external links
    needs: site
    if: github.event_name == 'schedule' || inputs.external-links
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out the link checker configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: tools/site/lychee.toml
          sparse-checkout-cone-mode: false
      - name: Download the Pages artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: github-pages
          path: ${{ runner.temp }}/artefact
      - name: Unpack the site under its base path
        env:
          BASE: ${{ needs.site.outputs.base }}
        run: |
          mkdir -p "$RUNNER_TEMP/site$BASE"
          tar -xf "$RUNNER_TEMP/artefact/artifact.tar" -C "$RUNNER_TEMP/site$BASE"
      - name: Install lychee
        env:
          LYCHEE_VERSION: 0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          archive="$RUNNER_TEMP/lychee.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
      - name: Check external links with retries
        env:
          BASE: ${{ needs.site.outputs.base }}
          URL: ${{ needs.site.outputs.url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/lychee" --config tools/site/lychee.toml \
            --root-dir "$RUNNER_TEMP/site" \
            --exclude "^${URL}" \
            --cookie-jar "$RUNNER_TEMP/lychee-cookies.json" \
            "$RUNNER_TEMP/site$BASE"

  deploy:
    name: Deploy to GitHub Pages
    needs: site
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy the Pages artefact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
