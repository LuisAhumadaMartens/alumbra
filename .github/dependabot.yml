version: 2
updates:
  - package-ecosystem: vcpkg
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: github.com/microsoft/vcpkg
        versions:
          - "<= 2026.10.31"
    groups:
      vcpkg:
        patterns:
          - "*"
    labels:
      - "type:chore"
      - "area:build"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "type:chore"
      - "area:ci"
